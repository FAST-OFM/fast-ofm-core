[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-ofm-core"
version = "0.1.0.dev0"
description = "Source-available Fast OFM research algorithms"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSES/PolyForm-Noncommercial-1.0.0.txt"]
authors = [
  {name = "Alexander Fridman", email = "AlexFridman@outlook.com"},
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pydantic>=2.7",
  "Pillow>=10",
]

[project.optional-dependencies]
validation = [
  "jsonschema>=4.23",
  "pytest>=8",
  "pytest-mock>=3.14",
]

[project.scripts]
fast-ofm-core = "fast_ofm_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fast_ofm_core = ["protocol/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
